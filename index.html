
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pro-Level Tuner & Metronome</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231A1A2E'/%3E%3Cpath d='M50 15 V 85 M15 50 H 85' stroke='%2339FF14' stroke-width='8'/%3E%3C/svg%3E">
</head>
<body>

    <div class="app-container">
        <div class="app-logo">MetroTuner</div>
        <header class="app-header">
            <button id="tuner-btn" class="nav-btn active">Afinador</button>
            <button id="metronome-btn" class="nav-btn">Metrónomo</button>
            <button id="settings-btn" class="nav-btn icon-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </header>

        <main class="app-main">
            <!-- Tuner View -->
            <div id="tuner-view" class="view active">
                <div class="tuner-container">
                    <div class="tuner-display">
                        <div class="note-name">--</div>
                        <div class="cents-display">0 cents</div>
                        <div class="accuracy-meter-bar">
                            <div class="accuracy-indicator"></div>
                        </div>
                        <div class="note-hz">Toca una cuerda</div>
                    </div>
                    <div class="instrument-display">
                        <div id="instrument-label" class="instrument-label"></div>
                        <div id="headstock-display" class="headstock-display">
                            <div id="headstock-left" class="headstock-side"></div>
                            <div id="headstock-right" class="headstock-side"></div>
                        </div>
                    </div>
                </div>
                <div class="controls-panel">
                    <div class="custom-select-wrapper">
                        <select id="tuning-select"></select>
                    </div>
                    <div class="mic-toggle-wrapper">
                        <label for="mic-toggle" class="mic-label">Micrófono</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="mic-toggle">
                            <span class="switch-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Metronome View -->
            <div id="metronome-view" class="view">
                <div class="metronome-container">
                    <div id="visual-indicator" class="visual-indicator">
                        <!-- Beat circles will be generated here -->
                    </div>
                    <div class="main-displays">
                        <div class="time-sig-display">
                            <span id="time-sig-value">4/4</span>
                        </div>
                        <div class="tempo-display">
                            <span id="bpm-value">120</span>
                            <span class="bpm-label">BPM</span>
                        </div>
                    </div>
                </div>
                <div class="controls-panel">
                    <div class="metronome-controls">
                        <input type="range" id="bpm-slider" min="40" max="300" value="120">
                        <div class="custom-select-wrapper">
                            <select id="time-sig-select">
                                <option value="2/4">2/4</option>
                                <option value="3/4">3/4</option>
                                <option value="4/4" selected>4/4</option>
                                <option value="5/4">5/4</option>
                                <option value="6/8">6/8</option>
                                <option value="7/8">7/8</option>
                                <option value="9/8">9/8</option>
                                <option value="12/8">12/8</option>
                            </select>
                        </div>
                        <div class="control-label">Presets de tempo</div>
                        <div id="preset-buttons-container" class="preset-controls">
                            <!-- Preset buttons will be populated here -->
                        </div>
                        <div class="volume-control">
                            <label for="volume-slider">Volumen:</label>
                            <input type="range" id="volume-slider" min="0" max="100" value="100">
                        </div>
                        <button id="play-pause-btn">Play</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Gestión de Configuraciones</h2>
                <button id="close-modal-btn" class="close-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <!-- Save Current Config -->
                <div class="modal-section">
                    <h3>Guardar Configuración Actual</h3>
                    <div class="form-group">
                        <input type="text" id="config-name-input" placeholder="Nombre de la configuración...">
                        <button id="save-config-btn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                            Guardar
                        </button>
                    </div>
                </div>

                <!-- Saved Configs List -->
                <div class="modal-section">
                    <h3>Configuraciones Guardadas</h3>
                    <div id="saved-configs-list" class="configs-list">
                        <!-- Configs will be populated here -->
                    </div>
                </div>

                <!-- Custom Presets -->
                <div class="modal-section">
                    <h3>Presets de Tempo Personalizados</h3>
                    <div class="form-group">
                        <input type="text" id="preset-name-input" placeholder="Nombre del preset">
                        <input type="number" id="preset-bpm-input" placeholder="BPM">
                        <button id="add-preset-btn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            Añadir
                        </button>
                    </div>
                    <div id="custom-presets-list" class="configs-list">
                        <!-- Custom presets will be populated here -->
                    </div>
                </div>

                <!-- Import/Export -->
                <div class="modal-section">
                    <h3>Importar / Exportar</h3>
                    <div class="form-group">
                        <button id="export-configs-btn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            Exportar Todo
                        </button>
                        <label for="import-file-input" class="file-input-label">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Importar desde Archivo
                        </label>
                        <input type="file" id="import-file-input" accept=".json" style="display: none;">
                    </div>
                </div>
                 <!-- Share -->
                <div class="modal-section">
                    <h3>Compartir Configuración Actual</h3>
                    <div class="form-group">
                        <input type="text" id="share-url-input" readonly placeholder="Haz clic en 'Generar' para crear un enlace">
                        <button id="generate-share-url-btn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"></path></svg>
                            Generar
                        </button>
                        <button id="copy-share-url-btn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copiar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="tuner.js"></script>
    <script src="metronome.js"></script>
    <script src="settings.js"></script>
    <script src="main.js"></script>
</body>
</html>
